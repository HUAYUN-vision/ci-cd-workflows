# Reusable workflow: синхронизация .github/dependabot.yml с шаблоном.
#
# GitHub читает конфиг Dependabot только из самого репозитория, поэтому
# эталонные конфиги лежат в templates/dependabot/ этого репозитория, а этот
# workflow открывает PR в проекте, если его dependabot.yml отличается от шаблона.

name: Dependabot sync

on:
  workflow_call:
    inputs:
      template:
        description: "Имя шаблона из templates/dependabot/ (без .yml), например: node, nestjs"
        type: string
        required: true
      templates-repository:
        type: string
        default: HUAYUN-vision/ci-cd-workflows
      templates-ref:
        type: string
        default: main
      branch:
        description: "Ветка для PR"
        type: string
        default: chore/dependabot-sync
    secrets:
      templates-token:
        description: "Токен с доступом на чтение к репозиторию шаблонов (если он приватный)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.templates-repository }}
          ref: ${{ inputs.templates-ref }}
          token: ${{ secrets.templates-token || github.token }}
          path: .ci-templates
          sparse-checkout: templates/dependabot

      - name: Sync and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE: ${{ inputs.template }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          src=".ci-templates/templates/dependabot/${TEMPLATE}.yml"
          dst=".github/dependabot.yml"
          [[ -f "$src" ]] || { echo "::error::Шаблон $src не найден"; exit 1; }

          if [[ -f "$dst" ]] && cmp -s "$src" "$dst"; then
            echo "dependabot.yml совпадает с шаблоном '$TEMPLATE'."
            exit 0
          fi

          mkdir -p .github
          cp "$src" "$dst"
          rm -rf .ci-templates

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$dst"
          git commit -m "chore(deps): sync dependabot.yml with '${TEMPLATE}' template"
          git push --force origin "$BRANCH"

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "chore(deps): sync dependabot.yml" \
              --body "Автоматическая синхронизация \`.github/dependabot.yml\` с шаблоном \`templates/dependabot/${TEMPLATE}.yml\` из \`${{ inputs.templates-repository }}\`."
          fi
