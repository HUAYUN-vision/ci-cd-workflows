# Reusable workflow: автоматическое повышение версии по Conventional Commits.
#
# Работает только на ветке main. Анализирует коммиты с последнего тега:
#   feat!: / fix!: / BREAKING CHANGE  -> major
#   feat:                             -> minor
#   fix: / perf:                      -> patch
#   остальное (chore, docs, ...)      -> версия не меняется
#
# Обновляет файл версии (package.json + package-lock.json, или текстовый
# VERSION-файл), делает коммит "chore(release): vX.Y.Z", ставит тег и
# (опционально) создаёт GitHub Release.

name: Version

on:
  workflow_call:
    inputs:
      version-file:
        description: "Файл с версией: package.json, текстовый файл (например VERSION) или пусто — только теги"
        type: string
        default: package.json
      tag-prefix:
        description: "Префикс тега"
        type: string
        default: v
      create-release:
        description: "Создавать GitHub Release"
        type: boolean
        default: true
      git-user-name:
        type: string
        default: github-actions[bot]
      git-user-email:
        type: string
        default: 41898282+github-actions[bot]@users.noreply.github.com
    secrets:
      token:
        description: "PAT / GitHub App token, если main защищена от прямого push. По умолчанию GITHUB_TOKEN"
        required: false
    outputs:
      released:
        description: "true, если версия была повышена"
        value: ${{ jobs.version.outputs.released }}
      version:
        description: "Новая версия (без префикса)"
        value: ${{ jobs.version.outputs.version }}
      tag:
        description: "Новый тег"
        value: ${{ jobs.version.outputs.tag }}

permissions:
  contents: write

concurrency:
  group: version-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}

      - name: Calculate and apply new version
        id: bump
        shell: bash
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          GIT_USER_NAME: ${{ inputs.git-user-name }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        run: |
          set -euo pipefail

          # --- текущая версия и диапазон коммитов ---
          last_tag="$(git describe --tags --abbrev=0 --match "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || true)"
          if [[ -n "$last_tag" ]]; then
            current="${last_tag#"$TAG_PREFIX"}"
            range="${last_tag}..HEAD"
          else
            if [[ "$VERSION_FILE" == *package.json && -f "$VERSION_FILE" ]]; then
              current="$(node -p "require('./${VERSION_FILE}').version")"
            elif [[ -n "$VERSION_FILE" && -f "$VERSION_FILE" ]]; then
              current="$(tr -d '[:space:]' < "$VERSION_FILE")"
            else
              current="0.0.0"
            fi
            range="HEAD"
          fi
          current="${current%%[-+]*}"
          echo "Last tag: ${last_tag:-<none>}, current version: $current"

          # --- анализ коммитов ---
          bump=0   # 0 none, 1 patch, 2 minor, 3 major
          notes_feat="" notes_fix="" notes_breaking=""
          while IFS= read -r -d $'\x1e' entry; do
            entry="${entry#$'\n'}"
            sha="${entry%%$'\x1f'*}"
            msg="${entry#*$'\x1f'}"
            header="${msg%%$'\n'*}"
            [[ -z "$header" || "$header" == chore\(release\):* ]] && continue

            if [[ "$header" =~ ^[a-zA-Z]+(\([^\)]*\))?!: ]] || grep -qE '^BREAKING[ -]CHANGE:' <<<"$msg"; then
              (( bump < 3 )) && bump=3
              notes_breaking+="- ${header} (${sha:0:7})"$'\n'
            elif [[ "$header" =~ ^feat(\([^\)]*\))?: ]]; then
              (( bump < 2 )) && bump=2
              notes_feat+="- ${header} (${sha:0:7})"$'\n'
            elif [[ "$header" =~ ^(fix|perf)(\([^\)]*\))?: ]]; then
              (( bump < 1 )) && bump=1
              notes_fix+="- ${header} (${sha:0:7})"$'\n'
            fi
          done < <(git log "$range" --no-merges --format='%H%x1f%B%x1e')

          if (( bump == 0 )); then
            echo "Нет коммитов feat/fix/perf/breaking — версия не меняется."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<<"$current"
          case $bump in
            3) major=$((major + 1)); minor=0; patch=0 ;;
            2) minor=$((minor + 1)); patch=0 ;;
            1) patch=$((patch + 1)) ;;
          esac
          new="${major}.${minor}.${patch}"
          tag="${TAG_PREFIX}${new}"
          echo "New version: $current -> $new"

          # --- обновление файла версии ---
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          if [[ "$VERSION_FILE" == *package.json && -f "$VERSION_FILE" ]]; then
            dir="$(dirname "$VERSION_FILE")"
            (cd "$dir" && npm version "$new" --no-git-tag-version --allow-same-version >/dev/null)
            git add "$VERSION_FILE"
            [[ -f "$dir/package-lock.json" ]] && git add "$dir/package-lock.json"
          elif [[ -n "$VERSION_FILE" ]]; then
            echo "$new" > "$VERSION_FILE"
            git add "$VERSION_FILE"
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${tag}"
          fi
          git tag -a "$tag" -m "Release ${tag}"
          git push origin HEAD:main
          git push origin "$tag"

          # --- release notes ---
          {
            [[ -n "$notes_breaking" ]] && printf '## ⚠ Breaking changes\n%s\n' "$notes_breaking"
            [[ -n "$notes_feat" ]] && printf '## Features\n%s\n' "$notes_feat"
            [[ -n "$notes_fix" ]] && printf '## Bug fixes\n%s\n' "$notes_fix"
            true
          } > "$RUNNER_TEMP/release-notes.md"

          {
            echo "released=true"
            echo "version=$new"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.bump.outputs.released == 'true' && inputs.create-release
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
