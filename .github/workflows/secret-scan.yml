# Reusable workflow: поиск секретов в коммитах (Gitleaks).
#
# PR   — проверяются только коммиты PR.
# push — проверяются новые коммиты push (при первом push — вся история).
# Ложные срабатывания добавляйте в .gitleaksignore (fingerprint из лога).
#
# Используется бинарник gitleaks напрямую (MIT), а не gitleaks-action:
# тот требует платную лицензию для организаций.

name: Secret scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: 8.30.1
      gitleaks-sha256:
        description: "SHA-256 архива gitleaks_<version>_linux_x64.tar.gz"
        type: string
        default: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      full-history:
        description: "Всегда сканировать всю историю"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full-history }}
        run: |
          set -euo pipefail
          opts=""
          if [[ "$FULL" != "true" ]]; then
            if [[ "$EVENT" == pull_request* && -n "$PR_BASE" ]]; then
              opts="${PR_BASE}..${PR_HEAD}"
            elif [[ "$EVENT" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
              opts="${BEFORE}..${GITHUB_SHA}"
            fi
          fi
          echo "Scan range: ${opts:-<full history>}"
          gitleaks git . --redact --verbose --no-banner ${opts:+--log-opts="$opts"}
